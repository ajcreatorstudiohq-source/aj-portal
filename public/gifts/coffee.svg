<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      .steam{animation:rise 1.4s ease-in-out infinite}
      .steam2{animation:rise 1.4s ease-in-out .3s infinite}
      @keyframes rise{0%,100%{opacity:.2;transform:translateY(8px)}50%{opacity:1;transform:translateY(-6px)}}
      .cup{animation:bob .9s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    </style>
  </defs>
  <g class="cup">
    <rect x="28" y="48" width="56" height="42" rx="10" fill="#f59e0b"/>
    <path d="M84 58h10a12 12 0 0 1 0 24H84" fill="none" stroke="#fbbf24" stroke-width="6"/>
    <ellipse cx="56" cy="48" rx="28" ry="8" fill="#fde68a"/>
  </g>
  <path class="steam" d="M44 40c0-10 8-10 8-18" fill="none" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>
  <path class="steam2" d="M62 40c0-10 8-10 8-18" fill="none" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>
</svg>
